<div class="container">
  <div class="row g-2 mt-2  justify-content-center">
    <div class="col-12 col-md-6 col-lg-8">
      <article class="card border-0 border-start border-5 border-black  border-end bg-primary rounded-4">
        <div class="card-body text-light text-center  p-4">
          <h3 class="fw-bold">To do List Angular, Flask e PostgreSQL</h3>
        </div>
      </article>
    </div>
    <div class="col-12 col-md-6 col-lg-8">
      <app-form-input [nome]="novaPessoa" [buscar]="buscarPessoa.bind(this)"></app-form-input>
    </div>
    <div class="col-12 col-md-6 col-lg-8">
      <article class="card border-0 border-5 border-start bg-primary rounded-4 border-black border-end">
      @for(p of pessoas(); track p.id){
          <div class="card-body">

            <article class="card border-0 border-5 border-start border-dark bg-light border-end cor rounded-4">
              <div class="card-body text-dark d-flex flex-row gap-2 justify-content-between " (mouseenter)="pessoaSelecionada = p.id">
                <p class="fw-bold">{{p.id}}</p>
                <p class="fw-bold">{{p.nome}}</p>
                <div class="d-flex flex-row gap-2">

                  <div role="button" class="rounded-5 bg-dark d-flex align-items-center p-1" (click)="deletarPessoa()">
                    <img role="button" src="https://cdn-icons-png.flaticon.com/512/4437/4437007.png"  width="30" height="30" alt="">
                  </div>
                  <div class="p-1 rounded-5 bg-dark" role="button" (click)="abrirEditar(p)">
                    <img src="https://cdn-icons-png.flaticon.com/512/5996/5996831.png" class="" height="30" width="30" alt="">
                  </div>
                </div>
              </div>
              </article>
              @if(editar === p.id){
                <div class="d-flex justify-content-start mt-2">
                <div class="col-12 col-md-6 col-lg-12">
                    <app-edit-pessoa [nome]="novaPessoa" [id]="editar" [buscar]="buscarPessoa.bind(this) "></app-edit-pessoa>
                  </div>
              </div>
              }

          </div>
        }
      </article>
    </div>
</div>
</div>
